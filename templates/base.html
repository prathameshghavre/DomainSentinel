<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DomainSentinel{% endblock %}</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background: #f4f6f8; color: #1f2937; margin: 0; line-height: 1.5; }
  header { background: #111827; padding: 14px 24px; }
  header a { color: #fff; text-decoration: none; font-size: 20px; font-weight: 600; }
  .tagline { color: #9ca3af; margin-left: 14px; font-size: 14px; }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h2 { margin-top: 0; font-size: 18px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; font-size: 14px; vertical-align: top; }
  th { background: #f9fafb; }
  input[type=text] { padding: 10px; width: 60%; max-width: 420px; border: 1px solid #9ca3af; border-radius: 6px; }
  button, .btn { padding: 10px 16px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
  .btn-light { background: #e5e7eb; color: #111827; }
  .inline-form { display: inline-block; margin: 4px 6px 4px 0; }
  .error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-top: 12px; }
  .unknown { background: #fef3c7; color: #92400e; padding: 8px 10px; border-radius: 6px; margin: 6px 0; }
  .badge { padding: 3px 10px; border-radius: 12px; font-weight: 600; font-size: 13px; color: #fff; }
  .low { background: #16a34a; } .medium { background: #d97706; }
  .high { background: #ea580c; } .critical { background: #dc2626; }
  .verdict { padding: 14px 18px; border-radius: 8px; margin-bottom: 18px; }
  .verdict ul { margin: 6px 0 6px 18px; padding: 0; }
  .verdict.low { background: #dcfce7; color: #166534; }
  .verdict.medium { background: #fef3c7; color: #92400e; }
  .verdict.high { background: #ffedd5; color: #9a3412; }
  .verdict.critical { background: #fee2e2; color: #991b1b; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; padding: 0; margin: 0; list-style: none; }
  .steps li { background: #f9fafb; border-radius: 8px; padding: 14px; }
  .num { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%; background: #2563eb; color: #fff; font-weight: 700; margin-bottom: 6px; }
  dt { font-weight: 600; margin-top: 10px; }
  dd { margin: 2px 0 0; color: #4b5563; }
  .score { font-size: 36px; font-weight: 700; }
  .muted { color: #6b7280; font-size: 13px; }
  .wrap { word-break: break-all; }
</style>
</head>
<body>
<header>
  <a href="{{ url_for('index') }}">DomainSentinel</a>
  <span class="tagline">Check if a website name looks risky</span>
</header>
<main>
{% block content %}{% endblock %}
<p class="muted">Uses only public data (WHOIS, DNS, IP location). Results are indicators, not a final verdict. For authorized and lawful use only.</p>
</main>
</body>
</html>
