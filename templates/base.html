<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DomainSentinel{% endblock %}</title>
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --panel2:#0d1526; --line:#1f2a44; --text:#e5e7eb; --muted:#94a3b8; --accent:#38bdf8; --low:#22c55e; --medium:#f59e0b; --high:#f97316; --critical:#ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--panel2); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
  .brand { font-size: 19px; font-weight: 700; padding: 6px 10px 18px; }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .nav a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--muted); margin-bottom: 4px; font-size: 14px; }
  .nav a:hover { background: var(--panel); color: var(--text); text-decoration: none; }
  .nav a.active { background: var(--panel); color: var(--accent); font-weight: 600; }
  .content { flex: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--panel2); }
  .topbar form { display: flex; gap: 8px; width: 100%; max-width: 560px; }
  main { padding: 24px 28px; max-width: 1100px; }
  input[type=text], select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  input[type=text] { flex: 1; min-width: 0; }
  button, .btn { background: var(--accent); color: #04121f; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block; }
  button:hover, .btn:hover { opacity: .9; text-decoration: none; }
  .btn.ghost, button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid2 .card { margin-bottom: 0; }
  .grid2 { margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 30px; font-weight: 700; margin-top: 2px; }
  .c-high { color: var(--high); } .c-low { color: var(--low); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .kv th { width: 150px; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: 700; font-size: 12px; color: #04121f; }
  .badge.low { background: var(--low); } .badge.medium { background: var(--medium); }
  .badge.high { background: var(--high); } .badge.critical { background: var(--critical); color: #fff; }
  .barrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .barlabel { width: 64px; color: var(--muted); }
  .barnum { width: 30px; text-align: right; }
  .bar { flex: 1; height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .barfill { height: 100%; border-radius: 6px; }
  .barfill.low { background: var(--low); } .barfill.medium { background: var(--medium); }
  .barfill.high { background: var(--high); } .barfill.critical { background: var(--critical); }
  .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .alert.error { background: #3b1219; color: #fca5a5; border: 1px solid #7f1d1d; }
  .note { background: #2a2108; color: #fcd34d; border: 1px solid #5c4710; padding: 8px 12px; border-radius: 8px; margin: 8px 0; font-size: 13px; }
  .muted { color: var(--muted); font-size: 13px; }
  .wrap { word-break: break-all; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .head h1 { margin-bottom: 2px; }
  .actions { display: flex; gap: 8px; }
  .scorecard { display: flex; gap: 28px; align-items: center; }
  .bigscore { font-size: 56px; font-weight: 800; line-height: 1; }
  .bigscore span { font-size: 18px; color: var(--muted); font-weight: 400; }
  .scoreright { flex: 1; }
  .scoreright p { margin: 10px 0 4px; }
  .scoreright ul { margin: 4px 0 0 18px; padding: 0; color: var(--muted); font-size: 13px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .examples form { display: inline-block; margin: 0 6px 6px 0; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
  .steps li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 14px; }
  .num { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%; background: var(--accent); color: #04121f; font-weight: 700; margin-bottom: 6px; }
  dt { font-weight: 600; margin-top: 12px; }
  dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  footer { padding: 4px 28px 24px; }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 10px; }
    .brand { padding: 4px 10px; }
    .grid2, .stats { grid-template-columns: 1fr 1fr; }
    .scorecard { flex-direction: column; align-items: flex-start; }
    main { padding: 16px; }
  }
  @media (max-width: 560px) { .grid2, .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">DomainSentinel<small>Domain risk analysis</small></div>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('history_page') }}" class="{{ 'active' if active == 'history' }}">History</a>
      <a href="{{ url_for('about') }}" class="{{ 'active' if active == 'about' }}">About</a>
    </nav>
  </aside>
  <div class="content">
    <div class="topbar">
      <form method="post" action="{{ url_for('scan') }}">
        <input type="text" name="domain" placeholder="Scan a domain, for example example.com" maxlength="253" required>
        <button type="submit">Scan</button>
      </form>
    </div>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="muted">Uses only public data (WHOIS, DNS, IP location). Results are indicators, not a final verdict. For authorized and lawful use only.</footer>
  </div>
</div>
</body>
</html>
